<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">

  <style>




#retryBtn{

   .card {

.buttons{

  gap: 32px;          /* απόσταση ανάμεσά τους */

}

button{
  width: 280px;       /* ίδιο πλάτος */
  height: 105px;       /* ίδιο ύψος */
  padding: 0;         /* σβήνει το διαφορετικό “φούσκωμα” */

  margin-right: 0;

  background-image: url("images/no.JPEG");
}


    /*αμα πει ναι */

  position: fixed;
  inset: 0;

  background-image: url("images/yes-bg.jpeg");
  background-size: cover;

     /*αμα πει οχι */

#noScene {
  position: fixed;
  inset: 0;

  background-image: url("images/no-bg.JPEG");
  background-size: cover;
  background-position: center 10%

  color: white;

.yes-box{
  background: rgba(255, 255, 255, 0.25);

</head>

<body>


<div id="noScene">
  <h1>😌 Θα έπρεπε να ντρέπεσαι 💔 </h1>
  <p>Κοίτα ποιον μπέμπη εσύ στεναχωρείς    </p>
   <button id="retryBtn">θα σου δώσω άλλη μια ευκαιρία 💖</button>
</div>




<div id="yesScene">
  <div class="yes-box">
    <h1>💖 ΓΙΑ ΠΑΝΤΑ ΜΑΖΙ 💖</h1>
    <p>ΣΕ ΑΚΟΜΑ ΑΠΕΙΡΕΣ ΩΡΑΙΕΣ ΣΤΙΓΜΕΣ ΜΕ ΤΗΝ 2026 ΒΑΛΕΝΤΙΝΑ ΜΟΥ 🥰</p>
  </div>
</div>
















  <div class="card" id="mainCard">
    <h1>Θες να είσαι η Βαλεντίνα μου; 💘</h1>

    <div class="buttons">
      <button id="yesBtn">ΝΑΙ 😍</button>
      <button id="noBtn">ΟΧΙ 🙄</button>
    </div>

   
  </div>

  <script>
 
 
 
 let noHoverCount = 0;
 const MAX_HOVERS = 20;


    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");




 //   κουμπι ΝΑΙ να αλλαζει μπακραουνντ 
   yesBtn.addEventListener("click", () => {
  document.querySelector(".card").style.display = "none";
  document.getElementById("yesScene").style.display = "flex";
});





function rectsOverlap(a, b) {
  return !(
    a.right <= b.left ||
    a.left >= b.right ||
    a.bottom <= b.top ||
    a.top >= b.bottom
  );
}

noBtn.addEventListener("mouseover", () => {
  if (noHoverCount >= MAX_HOVERS - 1) return;
  noHoverCount++;
  // Αν είναι η τελευταία φορά, άλλαξε μήνυμα
if (noHoverCount === MAX_HOVERS - 1) {
  noBtn.textContent = "ΤΕΛΕΥΤΑΙΑ ΕΥΚΑΙΡΙΑ 😳";
}


  const padding = 10;
  const maxTries = 60;

  // Ξεκίνα από καθαρή βάση (ώστε οι μετρήσεις να βγαίνουν σωστές)
  noBtn.style.transform = "translate(0px, 0px)";

  const baseRect = noBtn.getBoundingClientRect();   // θέση κουμπιού χωρίς translate
  const yesRect = yesBtn.getBoundingClientRect();   // θέση ΝΑΙ (σταθερό)

  // Όρια translate ώστε το κουμπί να ΜΗΝ βγει εκτός viewport
  const minDx = -baseRect.left + padding;
  const maxDx = (window.innerWidth - baseRect.right) - padding;
  const minDy = -baseRect.top + padding;
  const maxDy = (window.innerHeight - baseRect.bottom) - padding;

  let dx = 0, dy = 0;
  let tries = 0;

  do {
    dx = minDx + Math.random() * (maxDx - minDx);
    dy = minDy + Math.random() * (maxDy - minDy);

    noBtn.style.transform = `translate(${dx}px, ${dy}px)`;
    const newRect = noBtn.getBoundingClientRect();

    tries++;
    if (!rectsOverlap(newRect, yesRect)) break;
  } while (tries < maxTries);
});


  // οταν το πατησει 

 noBtn.addEventListener("click", () => {
  document.querySelector(".card").style.display = "none";
  document.getElementById("noScene").style.display = "flex";
});



const retryBtn = document.getElementById("retryBtn");

retryBtn.addEventListener("click", () => {
  document.getElementById("noScene").style.display = "none";
  document.getElementById("yesScene").style.display = "none";

  const mainCard = document.getElementById("mainCard");
  mainCard.style.display = "block";

  // reset για το ΟΧΙ
  noHoverCount = 0;
  noBtn.style.transform = "translate(0px, 0px)";
  noBtn.style.display = "none"; // αν θες να μείνει μόνο το ΝΑΙ μετά
});



  </script>

</body>

</html>
